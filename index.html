<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>静海冥想</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Georgia', serif;
      cursor: crosshair;
      user-select: none;
    }

    /* ── Canvas layer ── */
    #scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ── SVG overlay for stars & splashes ── */
    #overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* ── UI hint ── */
    #hint {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.45);
      font-size: 13px;
      letter-spacing: 2px;
      text-align: center;
      transition: opacity 1s;
      pointer-events: none;
    }

    /* ── Time indicator ── */
    #time-label {
      position: absolute;
      top: 24px;
      right: 32px;
      color: rgba(255,255,255,0.35);
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      pointer-events: none;
      transition: opacity 1s;
    }

    /* mobile tap highlight off */
    canvas { -webkit-tap-highlight-color: transparent; touch-action: none; }
  </style>
</head>
<body>

<canvas id="scene"></canvas>
<svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="hint">点击海面激起浪花 · 夜晚点击天空许下心愿</div>
<div id="time-label">dawn</div>

<script>
/* ═══════════════════════════════════════════════════════
   MEDITATION OCEAN  –  pure canvas + svg, no deps
   Day/night cycle: 60 s full loop  (30 s day, 30 s night)
   ═══════════════════════════════════════════════════════ */

const canvas  = document.getElementById('scene');
const ctx     = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const hint    = document.getElementById('hint');
const timeLabel = document.getElementById('time-label');

// ── Resize ─────────────────────────────────────────────
let W, H, HORIZON;
function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  HORIZON = H * 0.48;
}
window.addEventListener('resize', resize);
resize();

// ── Cycle config ───────────────────────────────────────
const CYCLE_MS   = 60_000;   // 60 s full loop
const HALF       = CYCLE_MS / 2; // 30 s each phase
// Within each half: 0→8 s rise, 8→22 s full, 22→30 s set
const RISE_END   = 8_000;
const SET_START  = 22_000;

// ── Stars store ────────────────────────────────────────
const stars = [];
let starId = 0;

// ── Wave ripples store ─────────────────────────────────
const ripples = [];
let rippleId = 0;

// ── Time tracking ──────────────────────────────────────
let startTime = performance.now();
function cycleT(now) {
  return (now - startTime) % CYCLE_MS;          // 0 … 59999
}
function phaseT(now) {
  const t = cycleT(now);
  return t < HALF ? { phase: 'day',   t: t }
                  : { phase: 'night', t: t - HALF };
}

// ── Color helpers ──────────────────────────────────────
function lerp(a, b, k) { return a + (b - a) * k; }
function lerpC(c1, c2, k) {
  return [
    Math.round(lerp(c1[0], c2[0], k)),
    Math.round(lerp(c1[1], c2[1], k)),
    Math.round(lerp(c1[2], c2[2], k)),
  ];
}
function rgb(c, a=1) {
  return a === 1 ? `rgb(${c[0]},${c[1]},${c[2]})`
                 : `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

// Sky palettes  [dawn, day, dusk]  and  [dusk, night, pre-dawn]
const SKY_DAY = {
  top:    [[245,120, 80], [  70,130,200], [245, 90, 60]],
  bottom: [[255,200,150], [ 160,200,240], [255,160,100]],
};
const SKY_NIGHT = {
  top:    [[245, 90, 60], [  10, 10, 35], [  10, 10, 35]],
  bottom: [[255,160,100], [  20, 25, 60], [  20, 25, 60]],
};

// Sea palettes
const SEA_DAY = {
  top:    [[  80,160,200], [ 30,100,160], [ 80,130,170]],
  bottom: [[  30,100,160], [ 10, 60,120], [ 30, 90,140]],
};
const SEA_NIGHT = {
  top:    [[ 80,130,170], [  5, 20, 55], [  5, 20, 55]],
  bottom: [[ 30, 90,140], [  2, 10, 35], [  2, 10, 35]],
};

// Phase progress: 0 = dawn/dusk, 0.5 = mid, 1 = dusk/dawn
function phaseProgress(t) {
  if (t < RISE_END)   return t / RISE_END * 0.5;
  if (t < SET_START)  return 0.5;
  return 0.5 + (t - SET_START) / (HALF - SET_START) * 0.5;
}

function triLerp(palette, p) {
  if (p <= 0.5) {
    const k = p / 0.5;
    return lerpC(palette[0], palette[1], k);
  } else {
    const k = (p - 0.5) / 0.5;
    return lerpC(palette[1], palette[2], k);
  }
}

// ── Draw sky ───────────────────────────────────────────
function drawSky(phase, p) {
  const pal = phase === 'day' ? SKY_DAY : SKY_NIGHT;
  const topC    = triLerp(pal.top,    p);
  const bottomC = triLerp(pal.bottom, p);
  const grad = ctx.createLinearGradient(0, 0, 0, HORIZON);
  grad.addColorStop(0,   rgb(topC));
  grad.addColorStop(1,   rgb(bottomC));
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, HORIZON);
}

// ── Draw sea ───────────────────────────────────────────
let waveOffset = 0;
function drawSea(phase, p, now) {
  const pal = phase === 'day' ? SEA_DAY : SEA_NIGHT;
  const topC    = triLerp(pal.top,    p);
  const bottomC = triLerp(pal.bottom, p);

  const grad = ctx.createLinearGradient(0, HORIZON, 0, H);
  grad.addColorStop(0,   rgb(topC));
  grad.addColorStop(1,   rgb(bottomC));
  ctx.fillStyle = grad;
  ctx.fillRect(0, HORIZON, W, H - HORIZON);

  // Animated surface waves — 5 layers, large amplitude
  waveOffset = now / 1400;
  const waveLayers = [
    { speed: 0.55, amp: 26, freq: 0.007, yOff:  0, alpha: 0.13 },
    { speed: 0.90, amp: 18, freq: 0.011, yOff: 22, alpha: 0.16 },
    { speed: 1.30, amp: 13, freq: 0.015, yOff: 46, alpha: 0.18 },
    { speed: 1.70, amp:  9, freq: 0.020, yOff: 72, alpha: 0.20 },
    { speed: 2.10, amp:  6, freq: 0.026, yOff:102, alpha: 0.22 },
  ];

  ctx.save();
  for (const lyr of waveLayers) {
    const yBase = HORIZON + lyr.yOff;
    ctx.globalAlpha = lyr.alpha;
    ctx.beginPath();
    ctx.moveTo(0, yBase);
    for (let x = 0; x <= W; x += 3) {
      const y = yBase
        + Math.sin(x * lyr.freq + waveOffset * lyr.speed) * lyr.amp
        + Math.sin(x * lyr.freq * 1.6 + waveOffset * lyr.speed * 0.7) * lyr.amp * 0.55
        + Math.sin(x * lyr.freq * 2.3 + waveOffset * lyr.speed * 1.3) * lyr.amp * 0.25;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fill();
  }
  ctx.restore();

  // Shimmer lines
  ctx.save();
  ctx.globalAlpha = 0.07;
  for (let i = 0; i < 6; i++) {
    const y = HORIZON + 30 + i * 28 + Math.sin(now / 2000 + i) * 4;
    const x0 = W * 0.3 + Math.sin(now / 3000 + i * 0.5) * W * 0.1;
    const shimmerGrad = ctx.createLinearGradient(x0, y, x0 + W * 0.4, y);
    shimmerGrad.addColorStop(0,   'rgba(255,255,255,0)');
    shimmerGrad.addColorStop(0.5, 'rgba(255,255,255,1)');
    shimmerGrad.addColorStop(1,   'rgba(255,255,255,0)');
    ctx.strokeStyle = shimmerGrad;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x0, y);
    ctx.lineTo(x0 + W * 0.4, y);
    ctx.stroke();
  }
  ctx.restore();
}

// ── Draw horizon glow — follows celestial body's x ─────
function drawHorizonGlow(phase, p, t) {
  const { x: cx } = celestialPos(t);
  const glowX = Math.max(0, Math.min(W, cx));     // clamp to screen

  const alpha = phase === 'day'
    ? (p < 0.5 ? lerp(0.55, 0.12, p / 0.5) : lerp(0.12, 0.55, (p - 0.5) / 0.5))
    : (p < 0.5 ? lerp(0.50, 0.04, p / 0.5) : lerp(0.04, 0.50, (p - 0.5) / 0.5));

  const glowColor = phase === 'day' ? '255,160,80' : '200,100,50';
  const glow = ctx.createRadialGradient(glowX, HORIZON, 0, glowX, HORIZON, W * 0.55);
  glow.addColorStop(0,   `rgba(${glowColor},${alpha})`);
  glow.addColorStop(0.4, `rgba(${glowColor},${alpha * 0.25})`);
  glow.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);
}

// ── Celestial arc: left horizon → top center → right horizon ───
function celestialPos(t) {
  const norm    = t / HALF;                        // 0 → 1
  const submerge = 55;                             // px below horizon at rise/set
  const peakY    = H * 0.07;                       // highest point (near top)
  const arcH     = (HORIZON + submerge) - peakY;
  const x = lerp(-60, W + 60, norm);
  const y = (HORIZON + submerge) - Math.sin(norm * Math.PI) * arcH;
  return { x, y };
}

// horizon-alpha: fade in/out as body crosses horizon line
function horizonAlpha(y, r) {
  const depth = y - HORIZON;                       // >0 = below, <0 = above
  return Math.max(0, Math.min(1, (-depth + r) / (r * 2)));
}

function drawSun(t) {
  const { x, y } = celestialPos(t);
  const r = 36;
  const alpha = horizonAlpha(y, r);
  if (alpha <= 0.01) return;

  // Low-sun warmth factor (0=horizon, 1=zenith)
  const warmth = Math.max(0, 1 - Math.max(0, y) / HORIZON);

  ctx.save();
  // Clip to sky so sun rises cleanly from horizon
  ctx.beginPath(); ctx.rect(0, 0, W, HORIZON + 2); ctx.clip();

  // Corona
  const corona = ctx.createRadialGradient(x, y, r * 0.9, x, y, r * 5);
  corona.addColorStop(0,   `rgba(255,${Math.round(200 + warmth*55)},${Math.round(warmth*100)},${alpha * 0.35})`);
  corona.addColorStop(1,   'rgba(255,160,0,0)');
  ctx.fillStyle = corona;
  ctx.beginPath(); ctx.arc(x, y, r * 5, 0, Math.PI * 2); ctx.fill();

  // Disk
  const sunGrad = ctx.createRadialGradient(x - r*0.2, y - r*0.2, 0, x, y, r);
  sunGrad.addColorStop(0, `rgba(255,255,220,${alpha})`);
  sunGrad.addColorStop(1, `rgba(255,${Math.round(180 - warmth*30)},${Math.round(warmth*20)},${alpha})`);
  ctx.fillStyle = sunGrad;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

// ── Draw moon ──────────────────────────────────────────
function drawMoon(t) {
  const { x, y } = celestialPos(t);
  const r = 28;
  const alpha = horizonAlpha(y, r);
  if (alpha <= 0.01) return;

  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, HORIZON + 2); ctx.clip();

  // Glow
  const glow = ctx.createRadialGradient(x, y, r, x, y, r * 3.5);
  glow.addColorStop(0,   `rgba(200,215,255,${alpha * 0.22})`);
  glow.addColorStop(1,   'rgba(100,120,200,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(x, y, r * 3.5, 0, Math.PI * 2); ctx.fill();

  // Disk
  ctx.globalAlpha = alpha;
  const moonGrad = ctx.createRadialGradient(x - r*0.25, y - r*0.25, 0, x, y, r);
  moonGrad.addColorStop(0, '#f5f0e8');
  moonGrad.addColorStop(1, '#c8cfe8');
  ctx.fillStyle = moonGrad;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();

  // Crescent shadow
  ctx.fillStyle = 'rgba(30,35,80,0.42)';
  ctx.beginPath(); ctx.arc(x + r * 0.38, y, r * 0.86, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

// ── Draw background stars (fixed, night only) ──────────
let bgStars = null;
function buildBgStars() {
  bgStars = [];
  for (let i = 0; i < 120; i++) {
    bgStars.push({
      x: Math.random() * W,
      y: Math.random() * HORIZON * 0.92,
      r: Math.random() * 1.4 + 0.3,
      blink: Math.random() * Math.PI * 2,
    });
  }
}

function drawBgStars(phase, p, now) {
  if (phase !== 'night') return;
  const alpha = p < 0.5 ? lerp(0, 1, p / 0.5) : lerp(1, 0, (p - 0.5) / 0.5);
  if (alpha <= 0.02) return;
  if (!bgStars) buildBgStars();

  ctx.save();
  for (const s of bgStars) {
    const twinkle = 0.6 + 0.4 * Math.sin(now / 1200 + s.blink);
    ctx.globalAlpha = alpha * twinkle;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// ── User-clicked stars (SVG) ───────────────────────────
function addStar(cx, cy) {
  const id = `star-${starId++}`;
  const size = 12 + Math.random() * 10;
  const color = `hsl(${200 + Math.random()*60},80%,${78 + Math.random()*15}%)`;

  const el = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  el.setAttribute('id', id);

  // Glow circle
  const glowEl = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  glowEl.setAttribute('cx', cx);
  glowEl.setAttribute('cy', cy);
  glowEl.setAttribute('r',  size * 2.5);
  glowEl.setAttribute('fill', color.replace(')', ',0.18)').replace('hsl', 'hsla'));
  el.appendChild(glowEl);

  // 4-pointed star path
  const pts = starPoints(cx, cy, size, size * 0.35, 4);
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
  path.setAttribute('points', pts);
  path.setAttribute('fill', '#ffffff');
  el.appendChild(path);

  // Tiny center dot
  const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  dot.setAttribute('cx', cx);
  dot.setAttribute('cy', cy);
  dot.setAttribute('r',  2);
  dot.setAttribute('fill', '#ffffff');
  el.appendChild(dot);

  overlay.appendChild(el);

  const entry = { el, born: performance.now(), duration: 20_000 };
  stars.push(entry);
  return entry;
}

function starPoints(cx, cy, outerR, innerR, n) {
  let pts = '';
  for (let i = 0; i < n * 2; i++) {
    const angle = (i * Math.PI / n) - Math.PI / 2;
    const r = i % 2 === 0 ? outerR : innerR;
    pts += `${cx + r * Math.cos(angle)},${cy + r * Math.sin(angle)} `;
  }
  return pts.trim();
}

function updateStars(now) {
  for (let i = stars.length - 1; i >= 0; i--) {
    const s = stars[i];
    const age = now - s.born;
    if (age >= s.duration) {
      s.el.remove();
      stars.splice(i, 1);
    } else {
      // Fade out last 5 s
      const fadeStart = s.duration - 5000;
      const opacity = age > fadeStart
        ? 1 - (age - fadeStart) / 5000
        : 1;
      s.el.setAttribute('opacity', opacity.toFixed(3));
    }
  }
}

// ── Wave ripple (SVG) ──────────────────────────────────
function addRipple(cx, cy) {
  const id = `ripple-${rippleId++}`;
  const el = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  el.setAttribute('id', id);

  // 3 concentric ellipses
  for (let i = 0; i < 3; i++) {
    const ellipse = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
    ellipse.setAttribute('cx', cx);
    ellipse.setAttribute('cy', cy);
    ellipse.setAttribute('class', `ripple-ring ring-${i}`);
    ellipse.setAttribute('fill', 'none');
    ellipse.setAttribute('stroke', 'rgba(255,255,255,0.7)');
    ellipse.setAttribute('stroke-width', '1.5');
    ellipse.setAttribute('rx', 0);
    ellipse.setAttribute('ry', 0);
    el.appendChild(ellipse);
  }

  // Splash droplets
  for (let i = 0; i < 6; i++) {
    const angle = (i / 6) * Math.PI * 2;
    const drop = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    drop.setAttribute('cx', cx + Math.cos(angle) * 4);
    drop.setAttribute('cy', cy + Math.sin(angle) * 2);
    drop.setAttribute('r',  2.5);
    drop.setAttribute('fill', 'rgba(255,255,255,0.75)');
    drop.setAttribute('class', `drop drop-${i}`);
    el.appendChild(drop);
  }

  overlay.appendChild(el);
  const entry = { el, born: performance.now(), cx, cy, duration: 2200 };
  ripples.push(entry);
}

function updateRipples(now) {
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    const age = now - r.born;
    if (age >= r.duration) {
      r.el.remove();
      ripples.splice(i, 1);
      continue;
    }
    const prog = age / r.duration;
    const rings = r.el.querySelectorAll('ellipse');
    rings.forEach((ring, idx) => {
      const delay = idx * 0.18;
      const rp = Math.max(0, prog - delay);
      const maxRx = 55 + idx * 20;
      const maxRy = 22 + idx * 8;
      const rx = rp * maxRx;
      const ry = rp * maxRy;
      ring.setAttribute('rx', rx);
      ring.setAttribute('ry', ry);
      ring.setAttribute('stroke-opacity', (1 - rp).toFixed(3));
    });

    // Animate droplets
    const drops = r.el.querySelectorAll('circle');
    drops.forEach((drop, idx) => {
      if (idx >= 6) return;
      const angle = (idx / 6) * Math.PI * 2;
      const dist = prog * 32;
      const dy   = -Math.sin(prog * Math.PI) * 20; // arc
      drop.setAttribute('cx', r.cx + Math.cos(angle) * dist);
      drop.setAttribute('cy', r.cy + Math.sin(angle) * dist * 0.4 + dy);
      drop.setAttribute('opacity', (1 - prog).toFixed(3));
    });
  }
}

// ── Time label ─────────────────────────────────────────
function updateLabel(phase, p) {
  let label;
  if (phase === 'day') {
    if (p < 0.25)       label = 'dawn';
    else if (p < 0.75)  label = 'daytime';
    else                label = 'dusk';
  } else {
    if (p < 0.25)       label = 'dusk';
    else if (p < 0.75)  label = 'night';
    else                label = 'pre-dawn';
  }
  timeLabel.textContent = label;
}

// ── Click / touch interaction ──────────────────────────
function handleInteraction(x, y) {
  if (y < HORIZON - 10) {
    const { phase } = phaseT(performance.now());
    if (phase === 'night') addStar(x, y);
    else addDayBurst(x, y);
  } else {
    addRipple(x, y);
  }
}

canvas.addEventListener('click', e => handleInteraction(e.clientX, e.clientY));

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  initAudio();
  const t = e.changedTouches[0];
  handleInteraction(t.clientX, t.clientY);
}, { passive: false });

// ── Day burst (light sparkle when clicking sky in day) ──
const bursts = [];
function addDayBurst(cx, cy) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', cx);
    line.setAttribute('y1', cy);
    line.setAttribute('stroke', 'rgba(255,240,180,0.8)');
    line.setAttribute('stroke-width', 1.5);
    line.setAttribute('stroke-linecap', 'round');
    el.appendChild(line);
  }
  overlay.appendChild(el);
  bursts.push({ el, born: performance.now(), cx, cy, duration: 700 });
}

function updateBursts(now) {
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i];
    const age = now - b.born;
    if (age >= b.duration) { b.el.remove(); bursts.splice(i, 1); continue; }
    const prog = age / b.duration;
    const lines = b.el.querySelectorAll('line');
    lines.forEach((line, idx) => {
      const angle = (idx / 8) * Math.PI * 2;
      const len = prog * 24;
      line.setAttribute('x2', b.cx + Math.cos(angle) * len);
      line.setAttribute('y2', b.cy + Math.sin(angle) * len);
      line.setAttribute('opacity', (1 - prog).toFixed(3));
    });
  }
}

// ── Hint fade ──────────────────────────────────────────
setTimeout(() => { hint.style.opacity = '0'; }, 5000);

// ── Audio (Web Audio API – generative ocean) ──────────
let audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  buildOceanSound(audioCtx);
}
document.addEventListener('click', initAudio, { once: true });
document.addEventListener('touchstart', initAudio, { once: true });

function buildOceanSound(ac) {
  const master = ac.createGain();
  master.gain.value = 0.0;
  master.connect(ac.destination);
  master.gain.linearRampToValueAtTime(0.55, ac.currentTime + 3);

  // ── Layered pink/brown noise waves ──────────────────
  makeNoiseLayer(ac, master, { freq: 0.15, gain: 0.28, filterFreq: 420, q: 0.8 });
  makeNoiseLayer(ac, master, { freq: 0.07, gain: 0.20, filterFreq: 280, q: 0.6 });
  makeNoiseLayer(ac, master, { freq: 0.3,  gain: 0.15, filterFreq: 600, q: 1.0 });

  // ── Wind: filtered noise with slow LFO ──────────────
  makeWindLayer(ac, master);

  // ── Low rumble / deep ocean ──────────────────────────
  makeRumble(ac, master);
}

function makeNoiseLayer(ac, dest, { freq, gain, filterFreq, q }) {
  const bufLen = ac.sampleRate * 4;
  const buf    = ac.createBuffer(1, bufLen, ac.sampleRate);
  const data   = buf.getChannelData(0);
  // Brown noise approximation
  let last = 0;
  for (let i = 0; i < bufLen; i++) {
    const white = Math.random() * 2 - 1;
    last = (last + 0.02 * white) / 1.02;
    data[i] = last * 12;
  }

  const src = ac.createBufferSource();
  src.buffer = buf;
  src.loop   = true;
  src.loopStart = 0;
  src.loopEnd   = bufLen / ac.sampleRate;

  const filter = ac.createBiquadFilter();
  filter.type            = 'lowpass';
  filter.frequency.value = filterFreq;
  filter.Q.value         = q;

  const gainNode = ac.createGain();
  gainNode.gain.value = gain;

  // LFO for wave swell amplitude
  const lfo = ac.createOscillator();
  lfo.type      = 'sine';
  lfo.frequency.value = freq;
  const lfoGain = ac.createGain();
  lfoGain.gain.value = gain * 0.6;
  lfo.connect(lfoGain);
  lfoGain.connect(gainNode.gain);

  src.connect(filter);
  filter.connect(gainNode);
  gainNode.connect(dest);
  src.start();
  lfo.start();
}

function makeWindLayer(ac, dest) {
  const bufLen = ac.sampleRate * 6;
  const buf    = ac.createBuffer(1, bufLen, ac.sampleRate);
  const data   = buf.getChannelData(0);
  for (let i = 0; i < bufLen; i++) data[i] = Math.random() * 2 - 1;

  const src = ac.createBufferSource();
  src.buffer = buf;
  src.loop   = true;

  const hiPass = ac.createBiquadFilter();
  hiPass.type            = 'highpass';
  hiPass.frequency.value = 800;

  const loPass = ac.createBiquadFilter();
  loPass.type            = 'lowpass';
  loPass.frequency.value = 2200;

  const gainNode = ac.createGain();
  gainNode.gain.value = 0.04;

  const lfo = ac.createOscillator();
  lfo.type            = 'sine';
  lfo.frequency.value = 0.04;
  const lfoG = ac.createGain();
  lfoG.gain.value = 0.035;
  lfo.connect(lfoG);
  lfoG.connect(gainNode.gain);

  src.connect(hiPass);
  hiPass.connect(loPass);
  loPass.connect(gainNode);
  gainNode.connect(dest);
  src.start();
  lfo.start();
}

function makeRumble(ac, dest) {
  const bufLen = ac.sampleRate * 8;
  const buf    = ac.createBuffer(1, bufLen, ac.sampleRate);
  const data   = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < bufLen; i++) {
    const w = Math.random() * 2 - 1;
    last = (last + 0.005 * w) / 1.005;
    data[i] = last * 30;
  }

  const src = ac.createBufferSource();
  src.buffer = buf;
  src.loop   = true;

  const filter = ac.createBiquadFilter();
  filter.type            = 'lowpass';
  filter.frequency.value = 80;

  const gainNode = ac.createGain();
  gainNode.gain.value = 0.12;

  src.connect(filter);
  filter.connect(gainNode);
  gainNode.connect(dest);
  src.start();
}

// ── Main render loop ───────────────────────────────────
function render(now) {
  ctx.clearRect(0, 0, W, H);

  const { phase, t } = phaseT(now);
  const p = phaseProgress(t);

  drawSky(phase, p);
  drawHorizonGlow(phase, p, t);
  drawBgStars(phase, p, now);

  if (phase === 'day')   drawSun(t);
  else                   drawMoon(t);

  drawSea(phase, p, now);

  updateStars(now);
  updateRipples(now);
  updateBursts(now);
  updateLabel(phase, p);

  requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
